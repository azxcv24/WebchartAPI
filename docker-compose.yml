services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WEBCHART_REDIS_URL=redis://redis:6379/0
      - WEBCHART_DATA_DIR=/data/webchart
      - WEBCHART_DEBUG=true
    volumes:
      - webchart-data:/data/webchart
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  webchart-data:
  redis-data:
