[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webchart"
version = "0.1.0"
description = "대용량 데이터 서버사이드 차트 시각화 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0",
    "dask[dataframe]>=2024.1.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=23.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
connectors = [
    "boto3>=1.34",
    "aiobotocore>=2.12",
    "aioftp>=0.22",
    "asyncssh>=2.14",
    "smbprotocol>=1.13",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "fakeredis>=2.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webchart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
