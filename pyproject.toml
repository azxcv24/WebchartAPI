[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webchart"
version = "0.2.0"
description = "대용량 데이터를 왜곡 없이 그리는 서버사이드 차트 엔진 (픽셀 정렬 M4 집계, 타일 스트리밍)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "azxcv24" }]
requires-python = ">=3.11"
keywords = ["chart", "visualization", "large-data", "m4", "downsampling", "fastapi", "tiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0",
    "dask[dataframe]>=2024.1.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/azxcv24/WebchartAPI"
Repository = "https://github.com/azxcv24/WebchartAPI"
Issues = "https://github.com/azxcv24/WebchartAPI/issues"

[project.optional-dependencies]
connectors = [
    "boto3>=1.34",
    "aiobotocore>=2.12",
    "aioftp>=0.22",
    "asyncssh>=2.14",
    "smbprotocol>=1.13",
    "clickhouse-connect>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
    "httpx>=0.27.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "fakeredis>=2.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webchart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042: `str, Enum` is intentional (JSON-serializable enums for Pydantic v2);
# we don't switch to StrEnum to avoid changing str() semantics.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
